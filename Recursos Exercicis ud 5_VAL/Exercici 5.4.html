<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=iso-8859-1" />
    <title>Exercici 4.4</title>
    <script type="text/javascript">
      window.onload = function () {
        let generar = document
          .getElementById("generate")
          .addEventListener("click", (e) => {
            generate();
          });
        let comparar = document
          .getElementById("compare")
          .addEventListener("click", (e) => {
            compare();
          });
      };
      function generate() {
        let i = Math.floor(Math.random() * 9) + 1;
        let a = Math.floor(Math.random() * 9) + 1;
        document.getElementById("firstDiv").innerHTML = i;
        document.getElementById("secondDiv").innerHTML = a;
      }

      function compare() {
        let i = document.getElementById("firstDiv").innerHTML;
        let a = document.getElementById("secondDiv").innerHTML;
        if (i >= a) {
          document.getElementById("thirdDiv").innerHTML = i;
        } else {
          document.getElementById("thirdDiv").innerHTML = a;
        }
      }
    </script>
    <style type="text/css">
      #firstDiv,
      #secondDiv,
      #thirdDiv {
        width: 150px;
        height: 150px;
        border: thin solid silver;
        background: #f5f5f5;
        float: left;
        margin: 20px;
        font-size: 6em;
        color: #333;
        text-align: center;
        padding: 5px;
        font-family: Arial, Helvetica, sans-serif;
      }
      #firstDiv p,
      #secondDiv p,
      #thirdDiv p {
        margin: 0.2em 0;
      }
      #thirdDiv {
        margin-left: 1.3em;
        border-color: black;
      }
      .clear {
        clear: both;
      }
      #compare {
        margin-left: 11em;
      }
      #generate {
        font-size: 1.2em;
        margin-left: 8em;
      }
    </style>
  </head>
  <body>
    <input id="generate" type="button" value="Generar !!" />
    <div id="firstDiv"></div>
    <div id="secondDiv"></div>
    <div class="clear"></div>
    <input id="compare" type="button" value="<< Comparar >>" />
    <div id="thirdDiv"></div>
  </body>
</html>
