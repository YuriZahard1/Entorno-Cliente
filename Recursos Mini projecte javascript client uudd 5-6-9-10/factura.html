<!doctype html>
<html>
  <head>
    <meta http-equiv="content-type" content="text/html; charset=UTF-8" />
    <title>Factura</title>
    <meta charset="UTF-8" />
    <link href="bootstrap.css" rel="stylesheet" />
    <style>
      body {
        padding: 10px;
      }

      th {
        background-color: palegreen;
      }

      izd {
        text-align: right;
      }

      .container {
        background-color: darkseagreen;
      }

      select,
      input:hover {
        background-color: palegreen;
      }

      select,
      input:active {
        background-color: darkseagreen;
      }

      tr {
        line-height: 10px;
      }

      td .trborrar {
        text-align: right;
      }

      .produc {
        line-height: 20px;
      }

      .rojo {
        background-color: maroon;
        color: white;
        padding: 5px;
        border: black 0px solid;
        font-weight: 600;
      }

      .verde {
        background-color: seagreen;
        color: white;
        font-weight: 600;
      }

      #alta {
        position: fixed;
        background-color: white;
        top: 25%;
        left: 50%;
        padding: 20px;
        border: black 4px solid;
        display: none;
      }
    </style>
    <script type="text/javascript">
      window.onload = function () {
        let ver = document
          .querySelector("img")
          .addEventListener("click", (e) => {
            mostrar();
          });
        let desVer = document
          .querySelector("b")
          .addEventListener("click", (e) => {
            mostrar();
          });
        let anyade = document
          .getElementById("aProd")
          .addEventListener("click", (e) => {
            pone();
          });
        let seleccion = document
          .getElementById("producto")
          .addEventListener("change", function () {
            document.getElementById("precio").value = this.value;
          });
      };
      function mostrar() {
        var e = document.getElementById("alta"); //recoge todo el elemento alta
        if (e.style.display == "block") {
          //si se ve
          e.style.display = "none"; //que no se vea
        } else {
          //si no
          e.style.display = "block"; //que se vea
        }
      }
      function pone() {
        let nombre = document.getElementById("producto2").value;
        let precio = document.getElementById("precio2").value;
        let opcion = document.getElementById("producto");
        let repite = Array.from(opcion.children).some(
          (opt) => opt.textContent === nombre,
        );
        if (!repite && nombre !== "") {
          let newOption = document.createElement("option");
          newOption.value = precio;
          newOption.textContent = nombre;
          opcion.appendChild(newOption);
        } else {
          alert(
            "No puedes dejar el nombre del producto vacio o repetir productos",
          );
        }
      }
    </script>
  </head>

  <body>
    <div class="contenedor">
      <h1><img src="carrito2.jpg" width="75" />Carrito de la compra</h1>
      <div id="alta">
        <h1>Alta de articulo :</h1>
        <p>Producto&nbsp;<input type="text" id="producto2" /></p>
        <p>
          Precio&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<input
            type="text"
            id="precio2"
          />
        </p>
        <p>
          <button id="aProd" class="verde" type="button">
            Añadir Producto
          </button>
        </p>
        <p style="text-align: right; color: red">
          <b>X</b>
        </p>
      </div>
      <div style="margin: 10px">
        <pre>
     Producto                   Precio                    Unidades              Importe</pre
        >
        <select name="producto" id="producto">
          <option value="" selected="selected">
            Seleccione un producto...
          </option>
        </select>
        <input type="text" disabled="disabled" id="precio" />
        <input type="text" id="unidades" />
        <input type="text" id="importe" />
        <button class="verde" type="button">Añadir a la cesta</button>
      </div>
      <hr />
      <div class="container">
        <div class="row">
          <table class="table" id="tabla" border="1">
            <thead class="thead-dark">
              <tr class="thead-dark">
                <th class="thead-dark" id="izd">Producto</th>
                <th class="thead-dark">Precio</th>
                <th class="thead-dark">Unidades</th>
                <th class="thead-dark">Importe</th>
                <th></th>
              </tr>
            </thead>
            <tbody></tbody>
            <tfoot id="tfoot">
              <tr>
                <td></td>
                <td></td>
                <td>Total</td>
                <td align="right">0.00</td>
                <td style="width: 15px"></td>
              </tr>
            </tfoot>
          </table>
          <div class="form-group">
            <button type="button" class="btn btn-danger">Borrar cesta</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
