<!DOCTYPE html
    PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Exercici 2.1</title>
    <script type="text/javascript">

        var number = prompt("introduce un numero entero para conocer su factorial");

        var integer = parseInt(number);

        if (isNaN(integer)) {
            alert("El numero introducido no es correcto");
            exit;
        }

        if (integer <= 0) {
            alert("El número introducido ha de ser mayor que 0");
            exit;
        }

        var result = integer;

        for (var i = 2; i < integer; i++) {
            result *= i;
        }
        alert("El factorial de" + integer + " es " + result);
    </script>

</head>

<body>
</body>

</html>
