<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        let numero=prompt('Dime un numero menor o igual a 50')
        if (isNaN(numero)){
            alert('Introduce un numero valido')
            exit
        }

        if(numero>50){
            alert('El numero no puede ser mayor a 50')
            exit
        }

        for (let i = 1; i <= numero; i++) {
            for (let f = 1; f <= i; f++) {
                document.write(f);
            }
            document.write('<br>')    
        }
    </script>
</head>
<body>
    
</body>
</html>
