<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        const numero = 500;
        for (let i = 1; i <= numero; i++) {
            document.write(i);
            if (i % 4 == 0) {
                document.write('(Multiplo de 4)')
            }
            document.write('<br>');
            if (i % 5 == 0) {
                document.write('----------------------')
                document.write('<br>')
            }
        }
    </script>
</head>

<body>

</body>

</html>
