<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        const filas = parseInt(prompt('Indica el número de filas'));
        const columnas = parseInt(prompt('Indica el número de columnas'));

        let numero = 1; // el número más alto
        let html = '<table border="100">';


        function numeroPrimo(numero) {
            for (i = 2; i <= numero / 2; i++) {
                if (numero % i == 0) {
                    return false
                }
            }
            return true
        }

        for (let f = 0; f < filas; f++) {
            html += '<tr>';
            for (let c = 0; c < columnas; c++) {
                if (numeroPrimo(numero)) {
                    html += '<td style="background-color: yellow; border-color: blue; border-width: 100px;">' + numero + '</td>';
                } else {
                    html += '<td style="border-color: blue; border-width: 100px;">' + numero + '</td>';
                }
                numero++;
            }
            html += '</tr>';
        }

        html += '</table>';


        document.write(html);
    </script>
</head>

<body>
    <td style="border-width: 100px;"></td>
</body>

</html>
