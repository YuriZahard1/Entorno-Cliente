<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
const filas = parseInt(prompt('Indica el número de filas'));
        const columnas = parseInt(prompt('Indica el número de columnas'));

        let numero = filas * columnas; // el número más alto
        let html = '<table border="1">';

        for (let f = 0; f < filas; f++) {
            html += '<tr>';
            for (let c = 0; c < columnas; c++) {
                html += '<td>' + numero + '</td>';
                numero--; // vamos bajando
            }
            html += '</tr>';
        }

        html += '</table>';

        document.write(html);
    </script>
</head>
<body>
</body>
</html>
