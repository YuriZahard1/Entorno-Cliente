<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="text/javascript">
        const numero = Number(prompt('A que numero deseas llegar de la serie fibonacci'))
        if ((numero >= 1) && (numero <= 100)) {
            let x = 0
            let y = 1
            let z = 0

            document.write(x + ('<br>'))

            while (x + y <= numero) {
                z = x + y
                document.write(z + ('<br>'))
                y = x
                x = z
            }
        }
        else {
            alert("Número erróneo");
        }
    </script>
</head>

</body>

</html>
